[build]
  publish = "site"
  command = ""
  # Skip (free) when a commit only touches the daily data files; each production deploy costs credits.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)site/data'"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"
