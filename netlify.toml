[build]
  publish = "site"
  command = ""
  # Deploy only when the published site (site/, except site/data) or this file changes; each production deploy costs credits.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site netlify.toml ':(exclude)site/data'"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"
